<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>框架效应 · scene1 · 地下实验室</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #05070a; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
/* ============================================================================
   框架效应 · scene1「一间地下研发实验室」
   主体：一颗一人高的机械眼球（无脸/无躯干），站在「你」面前，盯着屏幕前的你。
   空间：灰色地下研发实验室 —— 金属操作台 / 一整面电脑屏幕阵列 / 服务器机柜 /
         设计蓝图 / 白板公式 / 失败日志 / 日光灯闪烁 / 管道滴水 / 地上零件箱。
   硬约束：帧纯函数 · 禁 Math.random · 渐变预烘焙 · 禁逐帧 filter
   管线：2D 离屏打底(sceneC) → WebGL 后处理(glC) → 合成到 #c（render.js 抓 #c）
   ========================================================================== */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const FPS = 30, TOTAL_FRAMES = 1090;         // 源帧（0.75× 播放 ≈ 48.4s）
const PARAMS = new URLSearchParams(location.search);

/* ---------- 分镜节拍表（源帧，[start, end)） ---------- */
const BEATS = {
  intro:       [0,    36],   // 片头：镜头从左侧 30° 缓缓转正（1.5s，人刚忙完才回头看它）
  eyeLine:     [36,   150],  // ① 机械眼球台词（中间弹出字幕）
  buttons:     [150,  210],  // ② 左右按钮亮起 · 作用标在按钮上方 · 中央弹出绿字屏「请做出选择」
  lookHands:   [210,  266],  // ③ 低头看双手
  blink1:      [266,  322],  // ④ 眨眼换场 + 右屏「他们」
  pressLeft:   [322,  400],  // ⑤ 按左绿 · 眼球中心开始旋转
  swapLR:      [400,  450],  // ⑥ 眨眼 绿↔红 + 右屏「是真的」
  bothYellow:  [450,  500],  // ⑦ 眨眼 双双变黄 + 右屏「不同吗」
  reveal:      [500,  580],  // ⑧ 眨眼 幻影淡出 · 露中央真按钮
  laugh:       [580,  670],  // ⑨ 眼球笑声 · 瞳孔放大 · 触手抽搐 · 屏全红
  thanks:      [670,  750],  // ⑩ 红色褪去 → 眼球说「谢谢」→ 整场化成蓝色发光体只剩眼珠 → 缓慢变暗
  qSub:        [750,  800],  // ⑪ 字幕「你选左还是右？」
  black:       [800,  822],  // ⑫ 黑屏 1s
  explain:     [822,  942],  // ⑭ 点题字幕
  end:         [942,  1005], // ⑮ 收尾字幕
  title:       [1005, 1090], // ⑬ 标题卡（含副标题）弹出 → 结束
};
const B = BEATS;

/* ---------- 剧情状态（帧的纯函数；全部由节拍表推导，节拍一动这里跟着动） ---------- */
let curF = 0;
const K = { press: B.pressLeft[0] + 8, pressEnd: B.thanks[0] + 6,      // 选中的按下 / 松手
            laughIn: B.laugh[0] + 4, laughOut: B.laugh[1],            // 笑声起 / 骤停
            redIn: B.laugh[0] + 12, redOut: B.laugh[1],               // 屏全红起 / 褪
            revealIn: B.reveal[0] + 20,                               // ⑧ 幻影淡出点
            swap2: B.swapLR[0] + 14, swap3: B.bothYellow[0] + 14,     // 两次眨眼内的换色点
            thanks: 690, blueIn: 700, blueFull: 742,                  // ⑩ 说谢谢 / 蓝化起 / 蓝满
            darkIn: 730, darkFull: 754 };                             // ⑩ 连眼珠一起变暗
function btnPhase(f) {            // 0 左绿右红 / 1 左红右绿 / 2 双黄 / 3 幻影淡出
  if (f < K.swap2) return 0;
  if (f < K.swap3) return 1;
  if (f < K.revealIn) return 2;
  return 3;
}
function phantomA(f) {            // 左右幻影可见度：⑧ 眨眼睁眼后淡出
  return 1 - smoothstep(K.revealIn, K.revealIn + 38, f);
}
function pressK(f) {              // 手指下压量 0..1
  return smoothstep(K.press, K.press + 20, f) * (1 - smoothstep(K.pressEnd, K.pressEnd + 26, f));
}
function laughK(f) {              // ⑨ 笑声强度
  return smoothstep(K.laughIn, K.laughIn + 34, f) * (1 - smoothstep(K.laughOut, K.laughOut + 18, f));
}
function redFlood(f) {            // ⑨ 后墙屏全红（⑩ 起随「平静下来」褪去）
  return smoothstep(K.redIn, K.redIn + 38, f) * (1 - smoothstep(K.redOut, K.redOut + 30, f));
}
function roomLit(f) {             // 房间亮度：⑩ 起随蓝化一起暗下去，末尾全黑
  if (f < K.thanks) return 1;
  const dim = smoothstep(K.thanks, K.blueIn, f) * 0.62;
  return Math.max(0, 1 - dim) * (1 - smoothstep(K.darkIn, K.darkFull, f));
}
function blueK(f) {               // ⑩ 整个场景化成蓝色发光体
  return smoothstep(K.blueIn, K.blueFull, f);
}
function darkK(f) {               // ⑩ 连眼珠子一起缓慢变暗到黑
  return smoothstep(K.darkIn, K.darkFull, f);
}
/* 每次眨眼之后，右侧监控屏上依次打出三个词（第四次眨眼不再换，留在「不同吗」） */
function blinkWord(f) {
  if (f >= 470) return { t: '不同吗', s: 470, per: 3.0 };
  if (f >= 418) return { t: '是真的', s: 418, per: 3.0 };
  if (f >= 296) return { t: '他们', s: 296, per: 3.0 };
  return null;
}
function selectPanel(f) {         // ② 中间弹出的 2D 绿字屏（等按钮作用标注看够、字放完才消失）
  const t0 = 218;                 // 弹出
  if (f < t0 || f > B.pressLeft[0] - 20) return 0;
  if (f < t0 + 8) return smoothstep(t0, t0 + 8, f);
  return 1 - smoothstep(B.pressLeft[0] - 46, B.pressLeft[0] - 20, f);
}
const ROAM = PARAMS.get('roam') === '1';           // 交互漫游预览（?roam=1）
window.__frame = parseInt(PARAMS.get('frame') ?? '0');

/* ---------- 数学 ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function srnd(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const subA = (f, a, b, c, d) => { if (f < a) return 0; if (f < b) return smoothstep(a, b, f); if (f < c) return 1; if (f < d) return 1 - smoothstep(c, d, f); return 0; };

/* ---------- 画布层 ---------- */
const disp = document.getElementById('c');
const dctx = disp.getContext('2d');
const sceneC = document.createElement('canvas'); sceneC.width = W; sceneC.height = H;
const sctx = sceneC.getContext('2d');
const glC = document.createElement('canvas'); glC.width = W; glC.height = H;
const gl = glC.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false });

/* ---------- WebGL 后处理 ---------- */
const VS = `
attribute vec2 aPos; varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const FS = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uFrame;
uniform float uCurve, uChroma, uScan, uGrain, uGlitch, uGrade, uVig, uWobble, uFade;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  vec2 uv = vUv;
  vec2 cc = uv - 0.5; float r2 = dot(cc, cc);
  uv += cc * r2 * uCurve;
  float band = floor(uv.y * 28.0);
  uv.x += (hash(vec2(band, floor(uFrame * 0.7))) - 0.5) * uWobble;
  float g = step(1.0 - uGlitch, hash(vec2(band, floor(uFrame))));
  uv.x += g * (hash(vec2(band, 7.0)) - 0.5) * 0.12 * uGlitch;
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
  float off = uChroma * (0.0018 + r2 * 0.010);
  vec3 col;
  col.r = texture2D(uTex, uv + vec2(off, 0.0)).r;
  col.g = texture2D(uTex, uv).g;
  col.b = texture2D(uTex, uv - vec2(off, 0.0)).b;
  float scan = 0.93 + 0.07 * sin(uv.y * uRes.y * 3.14159);
  col *= mix(1.0, scan, uScan);
  col.r *= 1.0 + 0.10 * uGrade; col.b *= 1.0 - 0.10 * uGrade;
  col *= 1.0 - uVig * smoothstep(0.22, 0.85, r2 * 2.0);
  col += (hash(uv * uRes + uFrame) - 0.5) * uGrain;
  col *= uFade;
  gl_FragColor = vec4(col, 1.0);
}`;
let prog = null, tex = null; const U = {};
function initGL() {
  const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, VS); gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, FS); gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) console.error('FS ERR:', gl.getShaderInfoLog(fs));
  prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error('LINK ERR:', gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uTex', 'uRes', 'uFrame', 'uCurve', 'uChroma', 'uScan', 'uGrain', 'uGlitch', 'uGrade', 'uVig', 'uWobble', 'uFade']) U[n] = gl.getUniformLocation(prog, n);
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.viewport(0, 0, W, H);
}
function post(p) {
  gl.useProgram(prog);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, sceneC);
  gl.uniform1i(U.uTex, 0);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform1f(U.uFrame, p.frame);
  gl.uniform1f(U.uCurve, p.curve); gl.uniform1f(U.uChroma, p.chroma);
  gl.uniform1f(U.uScan, p.scan); gl.uniform1f(U.uGrain, p.grain);
  gl.uniform1f(U.uGlitch, p.glitch); gl.uniform1f(U.uGrade, p.grade);
  gl.uniform1f(U.uVig, p.vig); gl.uniform1f(U.uWobble, p.wobble);
  gl.uniform1f(U.uFade, p.fade);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- 预烘焙：光斑 / 圆盘（避免逐帧新建渐变） ---------- */
const glowCache = {};
function bakeGlow(color) {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, color.replace('A', '0.95'));
  g.addColorStop(0.28, color.replace('A', '0.42'));
  g.addColorStop(0.62, color.replace('A', '0.12'));
  g.addColorStop(1, color.replace('A', '0'));
  x.fillStyle = g; x.fillRect(0, 0, S, S); return c;
}
const glow = c => (glowCache[c] || (glowCache[c] = bakeGlow(c)));
function glowAt(cx, cy, rx, ry, sprite, alpha) {
  if (alpha <= 0.008 || !isFinite(cx) || !isFinite(cy) || rx <= 0 || ry <= 0) return;
  sctx.save(); sctx.globalAlpha = alpha; sctx.translate(cx, cy); sctx.scale(rx, ry);
  sctx.drawImage(sprite, -1, -1, 2, 2); sctx.restore();
}
// 离轴高光球体（金属球面明暗），烘焙一次复用
function bakeSphere() {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(S * 0.34, S * 0.28, S * 0.03, S * 0.50, S * 0.52, S * 0.56);
  g.addColorStop(0.00, '#9aa5b1');
  g.addColorStop(0.30, '#6d7783');
  g.addColorStop(0.60, '#454e58');
  g.addColorStop(0.84, '#262c33');
  g.addColorStop(1.00, '#0e1215');
  x.fillStyle = g; x.fillRect(0, 0, S, S); return c;
}
// 球面明暗叠加（multiply 合成）：中心亮、边缘暗 —— 让眼眶/叶片/虹膜同处一个球面
function bakeSphereMod() {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(S * 0.36, S * 0.30, S * 0.02, S * 0.52, S * 0.54, S * 0.52);
  g.addColorStop(0.00, '#ffffff');
  g.addColorStop(0.42, '#c6cace');
  g.addColorStop(0.72, '#787c81');
  g.addColorStop(0.92, '#2b2d30');
  g.addColorStop(1.00, '#0d0e10');
  x.fillStyle = g; x.fillRect(0, 0, S, S); return c;
}
// 虹膜：暗红发光同心（中心亮、外缘暗）
function bakeIris() {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.00, '#4a1109');
  g.addColorStop(0.34, '#95220f');
  g.addColorStop(0.62, '#a62c17');
  g.addColorStop(0.86, '#541208');
  g.addColorStop(1.00, '#200804');
  x.fillStyle = g; x.fillRect(0, 0, S, S); return c;
}
// 墙面陈旧贴图（污渍 / 流痕 / 氧化亮斑），烘焙一次、分段平铺复用
function bakeGrime() {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  for (let i = 0; i < 90; i++) {                       // 柔和暗斑
    const gx = srnd(i * 3.11) * S, gy = srnd(i * 7.7) * S, r = 14 + srnd(i * 5.3) * 70;
    const g = x.createRadialGradient(gx, gy, 0, gx, gy, r);
    g.addColorStop(0, `rgba(10,12,14,${(0.10 + srnd(i * 2.1) * 0.16).toFixed(3)})`);
    g.addColorStop(1, 'rgba(10,12,14,0)');
    x.fillStyle = g; x.beginPath(); x.arc(gx, gy, r, 0, TAU); x.fill();
  }
  for (let i = 0; i < 26; i++) {                      // 垂直流痕
    const gx = srnd(i * 9.1) * S, w = 1.5 + srnd(i * 4.7) * 4;
    const y0 = srnd(i * 6.3) * S * 0.6, h = S * (0.2 + srnd(i * 8.5) * 0.7);
    const g = x.createLinearGradient(0, y0, 0, y0 + h);
    g.addColorStop(0, 'rgba(8,10,12,0.30)'); g.addColorStop(1, 'rgba(8,10,12,0)');
    x.fillStyle = g; x.fillRect(gx, y0, w, h);
  }
  for (let i = 0; i < 40; i++) {                      // 反碱 / 氧化亮斑
    const gx = srnd(i * 2.9 + 40) * S, gy = srnd(i * 5.1 + 40) * S, r = 6 + srnd(i * 3.3 + 40) * 26;
    const g = x.createRadialGradient(gx, gy, 0, gx, gy, r);
    g.addColorStop(0, `rgba(210,218,224,${(0.05 + srnd(i * 7.1 + 40) * 0.09).toFixed(3)})`);
    g.addColorStop(1, 'rgba(210,218,224,0)');
    x.fillStyle = g; x.beginPath(); x.arc(gx, gy, r, 0, TAU); x.fill();
  }
  return c;
}
let SPHERE = null, IRIS = null, SPHERE_MOD = null, GRIME = null;

/* ---------- 伪 3D 相机（手动透视 + pitch + 多边形近平面裁剪） ---------- */
const CAM = { x: 0, y: 1.32, z: 0.60, focal: 1180, pitch: 0, yaw: 0 };
const NEAR = 0.30;
function camSpace(x, y, z) {
  let cx = x - CAM.x;
  let cy = y - CAM.y;
  let cz = z - CAM.z;
  if (CAM.yaw) {                                  // 漫游模式的水平转向
    const c = Math.cos(CAM.yaw), s = Math.sin(CAM.yaw);
    const nx = cx * c - cz * s, nz = cx * s + cz * c;
    cx = nx; cz = nz;
  }
  if (CAM.pitch) {
    const c = Math.cos(CAM.pitch), s = Math.sin(CAM.pitch);
    const ny = cy * c + cz * s, nz = -cy * s + cz * c;
    cy = ny; cz = nz;
  }
  return { x: cx, y: cy, z: cz };
}
function proj(x, y, z) {
  const p = camSpace(x, y, z);
  if (p.z < NEAR) return null;
  const k = CAM.focal / p.z;
  return { x: W / 2 + p.x * k, y: H / 2 - p.y * k, s: k, cz: p.z };
}
function projPoly(pts) {
  const cp = pts.map(p => camSpace(p[0], p[1], p[2]));
  const out = [];
  for (let i = 0; i < cp.length; i++) {
    const a = cp[i], b = cp[(i + 1) % cp.length];
    const ain = a.z >= NEAR, bin = b.z >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin) {
      const t = (NEAR - a.z) / (b.z - a.z);
      out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: NEAR });
    }
  }
  return out.map(p => { const s = CAM.focal / p.z; return { x: W / 2 + p.x * s, y: H / 2 - p.y * s, s, cz: p.z }; });
}
function face(pts, fill, alpha) {
  const q = projPoly(pts); if (q.length < 3) return;
  sctx.save(); if (alpha !== undefined) sctx.globalAlpha *= alpha;
  sctx.beginPath(); sctx.moveTo(q[0].x, q[0].y);
  for (let i = 1; i < q.length; i++) sctx.lineTo(q[i].x, q[i].y);
  sctx.closePath(); sctx.fillStyle = fill; sctx.fill(); sctx.restore();
}
function seg3(A, B, col, widthWorld, alpha) {
  const a = proj(A[0], A[1], A[2]), b = proj(B[0], B[1], B[2]); if (!a || !b) return;
  sctx.save(); sctx.globalAlpha = alpha; sctx.strokeStyle = col; sctx.lineCap = 'round';
  sctx.lineWidth = Math.max(1.2, widthWorld * ((a.s + b.s) / 2));
  sctx.beginPath(); sctx.moveTo(a.x, a.y); sctx.lineTo(b.x, b.y); sctx.stroke(); sctx.restore();
}
function dot3(x, y, z, rWorld, col, alpha) {
  const p = proj(x, y, z); if (!p) return;
  const r = Math.max(0.8, rWorld * p.s);
  sctx.save(); sctx.globalAlpha = alpha; sctx.fillStyle = col;
  sctx.beginPath(); sctx.arc(p.x, p.y, r, 0, TAU); sctx.fill(); sctx.restore();
}
// 水平面（y 固定）上的圆 / 椭圆多边形 —— 透视压扁自动由投影承担
function discY(cx, cz, rx, rz, y, n) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU; pts.push([cx + Math.cos(a) * rx, y, cz + Math.sin(a) * rz]); }
  return pts;
}
// 在指定 3D 平面上以局部坐标 (0..iw, 0..ih) 绘制（角序：TL / TR / BL）
function localPlane(TL, TR, BL, iw, ih, fn, alpha) {
  const tl = proj(TL[0], TL[1], TL[2]), tr = proj(TR[0], TR[1], TR[2]), bl = proj(BL[0], BL[1], BL[2]);
  if (!tl || !tr || !bl) return;
  sctx.save(); if (alpha !== undefined) sctx.globalAlpha *= alpha;
  sctx.setTransform((tr.x - tl.x) / iw, (tr.y - tl.y) / iw, (bl.x - tl.x) / ih, (bl.y - tl.y) / ih, tl.x, tl.y);
  fn(iw, ih); sctx.restore();
}
function clearScene(col) {

const RW = 3.8, RH = 3.30, FAR = 9.2;          // 房间半宽 / 高 / 进深

/* 眼球中心自转：⑤ 选中之后开始稳定旋转，⑨ 笑声段加速 */
function irisSpin(f) {
  const t = Math.min(f, K.pressEnd);

/* 视角抖动：呼吸起伏（≈13 次/分）+ 微转向（头部不稳）+ 视差微抖 */

  const turn = Math.sin(f * 0.0064 + 0.4) * 0.8 + Math.sin(f * 0.0141 + 2.2) * 0.2;
  return {

   · 注意本工程约定：CAM.pitch 为正 = 视线向下（画面内容上移）；yaw 为负 = 视线偏左

  let pt = -0.03, y = 1.34, z = 0.62, yaw = 0;
  if (f < B.intro[1]) {                                    // 片头转头（1.5s = 34 源帧）
    const t = easeInOut(clamp(f / 34, 0, 1));
    yaw = lerp(-0.5236, 0, t) + Math.sin(t * Math.PI) * 0.010;   // 左侧 30° → 正前（带一点过冲）
    z = lerp(0.72, 0.62, easeOutCubic(clamp(f / 34, 0, 1)));     // 顺手往前靠

  } else if (f < B.lookHands[0]) {                          // ② 前倾，看按钮亮起
    const t = smoothstep(154, 208, f);
    pt = lerp(-0.030, 0.130, t); y = lerp(1.34, 1.44, t); z = lerp(0.62, 0.78, t);
  } else if (f < B.blink1[0]) {                             // ③ 俯视双手
    const t = smoothstep(212, 252, f);
    pt = lerp(0.130, 0.235, t); y = lerp(1.44, 1.49, t); z = lerp(0.78, 0.84, t);
  } else if (f < B.pressLeft[0]) {                          // ④ 眨眼：稳在俯视位
    pt = 0.232; y = 1.49; z = 0.84;
  } else if (f < B.reveal[1]) {                             // ⑤–⑧ 盯手与按钮
    pt = 0.226; y = 1.49; z = 0.84;
    yaw = lerp(0, -0.045, smoothstep(324, 368, f)) * (1 - smoothstep(402, 442, f));
  } else if (f < B.thanks[0]) {                             // ⑨ 笑声：后仰抬头直视眼球
    const t = smoothstep(B.laugh[0] + 2, B.laugh[0] + 74, f);
    pt = lerp(0.226, -0.050, t); y = lerp(1.49, 1.34, t); z = lerp(0.84, 0.62, t);
  } else if (f < B.thanks[1]) {                             // ⑩ 蓝化：视线定在眼球上，缓缓后收
    const t = smoothstep(B.thanks[0], B.thanks[0] + 46, f);
    pt = lerp(-0.050, -0.062, t); y = lerp(1.34, 1.332, t); z = lerp(0.62, 0.72, t);

    pt = -0.062; y = 1.332; z = 0.72;

  const j = jitter(f);

  CAM.x = j.x + Math.sin(f * 0.9) * sh;

}

function bez(A, C, B, t) {
  const u = 1 - t;

          u * u * A[2] + 2 * u * t * C[2] + t * t * B[2]];
}

function blinkK(f) {                       // 0 睁 / 1 合；四段各自 闭合-保持-张开

    [B.blink1[0], 16, 8, 20],        // ④ 换场
    [B.swapLR[0], 10, 6, 14],        // ⑥ 绿↔红
    [B.bothYellow[0], 10, 6, 14],    // ⑦ 双双变黄
    [B.reveal[0], 12, 12, 26],       // ⑧ 幻影淡出 · 露中央真按钮
  ];
  let k = 0;
  for (const [s, c, h, o] of SEGS) {
    const t1 = s + c, t2 = t1 + h, t3 = t2 + o;
    if (f <= s || f >= t3) continue;
    if (f < t1) k = Math.max(k, smoothstep(s, t1, f));

   ========================================================================== */
function faceO(pts, fill, stroke, lw) {
  const q = projPoly(pts); if (q.length < 3) return;
  sctx.save();
  sctx.beginPath(); sctx.moveTo(q[0].x, q[0].y);
  for (let i = 1; i < q.length; i++) sctx.lineTo(q[i].x, q[i].y);
  sctx.closePath(); sctx.fillStyle = fill; sctx.fill();
  if (stroke) { sctx.strokeStyle = stroke; sctx.lineWidth = lw || 1.3; sctx.lineJoin = 'round'; sctx.stroke(); }
  sctx.restore();
}
function limbO(x0, z0, x1, z1, w0, w1, y0, y1, col, hi, thick) {
  const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz) || 1;
  const nx = -dz / L, nz = dx / L;
  const A = [x0 + nx * w0, y0, z0 + nz * w0], B = [x0 - nx * w0, y0, z0 - nz * w0];
  const C = [x1 - nx * w1, y1, z1 - nz * w1], D = [x1 + nx * w1, y1, z1 + nz * w1];
  if (thick) {      // 侧壁：同轮廓整体下移 thick 的暗面 —— 浅视角下靠这层做出厚度
    faceO([[A[0], A[1] - thick, A[2]], [B[0], B[1] - thick, B[2]],
           [C[0], C[1] - thick, C[2]], [D[0], D[1] - thick, D[2]]], '#242a32', 'rgba(4,6,9,0.8)', 1.0);
  }
  faceO([A, B, C, D], col, 'rgba(6,8,12,0.92)', 1.4);
  // 受光边：选朝向镜头的那条长边画一条冷亮线（屏阵在背后打轮光）
  if (hi) {
    const near = (z0 + nz * w0) < (z0 - nz * w0);
    const e0 = near ? A : B, e1 = near ? D : C;
    sctx.save(); sctx.globalAlpha = 0.55; sctx.strokeStyle = hi; sctx.lineCap = 'round';
    const p0 = proj(e0[0], e0[1] + 0.004, e0[2]), p1 = proj(e1[0], e1[1] + 0.004, e1[2]);
    if (p0 && p1) { sctx.lineWidth = Math.max(1, 0.0045 * (p0.s + p1.s) / 2); sctx.beginPath(); sctx.moveTo(p0.x, p0.y); sctx.lineTo(p1.x, p1.y); sctx.stroke(); }
    sctx.restore();
  }
}
/* 指节：四边形 + 圆指端。圆头是「手」的关键 —— 尖角一律读成纸片 / 机械件 */
function cap(x0, z0, x1, z1, w, y0, y1, col, hi, thick) {
  limbO(x0, z0, x1, z1, w, w * 0.88, y0, y1, col, hi, thick);
  const t0 = discY(x1, z1, w * 0.95, w * 0.95 * 0.62, y1, 12);
  faceO(t0.map(p => [p[0], p[1] - thick, p[2]]), '#222831', 'rgba(4,6,9,0.8)', 1.0);
  faceO(t0, col, 'rgba(6,8,12,0.9)', 1.2);
}
/* 手：整体剪影 + 圆指端 + 侧壁厚度 + 前臂。
   掌背朝镜头抬起（不是平摊的一张面片）；四指强扇形张开 —— 浅视角下只有横向分量能撑出手指长度 */
function drawHand(f, ox, oz, yW, curl, aimX, aimZ) {
  const tside = ox < 0 ? 1 : -1;                     // 左=+1（拇指与食指朝画面中央）
  const SKIN = '#454e59', SKIN2 = '#4f5966';
  const SIDE = '#232a32', HI = 'rgba(178,206,228,0.60)';
  const yK = yW + 0.032, knuckZ = oz + 0.118;
  const yT = yW - 0.016 - curl * 0.018;
  // 前臂（从画面下缘外伸上来，搭在台面上 —— 有手臂，手才不显得漂着）
  const ax = ox * 1.60, az = oz - 0.40;
  sctx.save(); sctx.globalAlpha = 0.42;
  face([[ax - 0.070, CT + 0.004, az - 0.04], [ax + 0.070, CT + 0.004, az - 0.04],
        [ox + 0.056, CT + 0.004, oz - 0.02], [ox - 0.056, CT + 0.004, oz - 0.02]], 'rgba(3,5,8,1)');
  sctx.restore();
  cap(ax, az, ox, oz - 0.040, 0.062, 1.048, yW - 0.012, SKIN, 'rgba(176,204,226,0.28)', 0.030);
  // 掌：腕 → 指根，两端用圆收角
  const palm = [[ox - 0.070, yW, oz - 0.02], [ox + 0.070, yW, oz - 0.02],
                [ox + 0.080, yK, knuckZ], [ox - 0.080, yK, knuckZ]];
  faceO(palm.map(p => [p[0], p[1] - 0.030, p[2]]), SIDE, 'rgba(4,6,9,0.8)', 1.2);
  faceO(palm, SKIN, 'rgba(6,8,12,0.92)', 1.5);
  face(discY(ox + knuckZ * 0, knuckZ - 0.004, 0.079, 0.046, yK, 14), SKIN);      // 指根端圆
  face(discY(ox, oz - 0.018, 0.069, 0.040, yW, 14), SKIN);                        // 腕端圆
  face(discY(ox, knuckZ - 0.004, 0.074, 0.042, yK - 0.030, 14), SIDE);           // 指根端圆的侧壁
  face(discY(ox, oz - 0.018, 0.064, 0.037, yW - 0.030, 14), SIDE);               // 腕端圆的侧壁
  // 掌背受屏阵冷光
  sctx.save(); sctx.globalAlpha = 0.20;
  face([[ox - 0.050, yW + 0.006, oz - 0.005], [ox + 0.050, yW + 0.006, oz - 0.005],
        [ox + 0.058, yK + 0.006, knuckZ - 0.020], [ox - 0.058, yK + 0.006, knuckZ - 0.020]],
       'rgba(178,206,228,1)');
  sctx.restore();
  // 腕侧亮边
  sctx.save(); sctx.globalAlpha = 0.38; sctx.strokeStyle = HI; sctx.lineWidth = 2;
  const w0 = proj(ox - 0.070, yW + 0.004, oz - 0.02), w1 = proj(ox + 0.070, yW + 0.004, oz - 0.02);
  if (w0 && w1) { sctx.beginPath(); sctx.moveTo(w0.x, w0.y); sctx.lineTo(w1.x, w1.y); sctx.stroke(); }
  sctx.restore();
  // （手指已按要求去掉：只留掌 + 拇指的整体剪影）
  // 拇指（掌内侧，斜向前下）
  cap(ox + tside * 0.064, oz + 0.052, ox + tside * 0.132, oz + 0.156,
      0.032, yW + 0.014, yT + 0.006, SKIN, HI, 0.026);
}
function drawHands(f) {
  const press = pressK(f);
  const lp = smoothstep(K.press + 12, K.press + 36, f) * (1 - smoothstep(K.revealIn, K.revealIn + 22, f)); // 左手「按下」左幻影
  const rightY = 1.088 - press * 0.034;
  const leftY = 1.094 - lp * 0.038 - press * 0.014;
  const rightX = 0.215, leftX = -0.225;
  const rightZ = 1.70, leftZ = 1.71;
  drawHand(f, leftX, leftZ, leftY, 0.55, undefined, undefined);
  drawHand(f, rightX, rightZ, rightY, 0.35, BTN_X.center - 0.004, BTN_Z - 0.008);
}

/* ============================================================================
   ⑨ 后置监控屏：把「身后的电脑屏幕」映出的背影与眼球剪影搬到可见处
   ========================================================================== */
function drawRearMonitor(f) {
  const x0 = 0.52, x1 = 1.14;
  // 机身（含支架）
  face([[x0 - 0.045, CT, 2.09], [x1 + 0.045, CT, 2.09],
        [x1 + 0.045, 1.39, 2.33], [x0 - 0.045, 1.39, 2.33]], '#1a1f25');
  face([[x0 - 0.045, 1.39, 2.33], [x1 + 0.045, 1.39, 2.33],
        [x1 + 0.020, 1.40, 2.31], [x0 - 0.020, 1.40, 2.31]], '#252c34');
  const hot = smoothstep(148, 178, f) * (1 - smoothstep(206, 234, f));
  const bw = blinkWord(f);                                   // 每次眨眼后屏上打出的词
  localPlane([x0, 1.36, 2.30], [x1, 1.36, 2.30], [x0, 1.09, 2.12], 300, 168, (iw, ih) => {
    const x = sctx;
    if (bw) {
      // 眨眼之后：屏上打出系统给的词（绿字打字机，字放完停在屏上）
      x.fillStyle = '#03140c'; x.fillRect(0, 0, iw, ih);
      x.strokeStyle = 'rgba(74,244,152,0.40)'; x.lineWidth = 1.4;
      x.strokeRect(7, 7, iw - 14, ih - 14);
      const n = clamp(Math.floor((f - bw.s) / bw.per), 0, bw.t.length);
      const shown = bw.t.slice(0, n);
      x.font = '600 64px "Microsoft YaHei","SimHei",sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.shadowColor = 'rgba(60,225,140,0.95)'; x.shadowBlur = 18;
      x.fillStyle = 'rgba(126,255,178,1)';
      x.fillText(shown, iw / 2, ih * 0.47);
      if (n < bw.t.length) {                                 // 打字光标
        const ww = x.measureText(shown).width;
        x.shadowBlur = 0; x.fillStyle = 'rgba(126,255,178,0.95)';
        x.fillRect(iw / 2 + ww / 2 + 4, ih * 0.47 - 26, 3, 52);
      }
      x.shadowBlur = 0; x.textAlign = 'left'; x.textBaseline = 'top';
      x.font = '600 15px "Consolas",monospace';
      x.fillStyle = 'rgba(120,220,170,0.72)';
      x.fillText('SYS · MSG', 14, 12);
    } else {
      x.fillStyle = '#050f0c'; x.fillRect(0, 0, iw, ih);
      // 「你」的背影（后视剪影：头 + 肩）
      const bob = Math.sin(f * 0.028) * 1.6;
      x.fillStyle = 'rgba(8,20,16,1)';
      x.beginPath(); x.arc(iw * 0.50, ih * 0.50 + bob, ih * 0.155, 0, TAU); x.fill();
      x.beginPath(); x.ellipse(iw * 0.50, ih * 0.90 + bob, iw * 0.215, ih * 0.24, 0, 0, TAU); x.fill();
      // 轮廓冷边
      x.strokeStyle = `rgba(150,214,196,${(0.55 + 0.35 * hot).toFixed(3)})`; x.lineWidth = 1.6;
      x.beginPath(); x.arc(iw * 0.50, ih * 0.50 + bob, ih * 0.155, Math.PI * 1.15, Math.PI * 1.85); x.stroke();
      // 远处机械眼球剪影（在「你」之前方 → 画在背影之前，被背影遮住一部分）
      x.fillStyle = 'rgba(6,14,20,1)';
      x.beginPath(); x.arc(iw * 0.50, ih * 0.26, ih * 0.20, 0, TAU); x.fill();
      x.strokeStyle = 'rgba(214,72,54,0.75)'; x.lineWidth = 2;
      x.beginPath(); x.arc(iw * 0.50, ih * 0.26, ih * 0.20, 0, TAU); x.stroke();
      x.fillStyle = 'rgba(226,72,54,0.9)';
      x.beginPath(); x.arc(iw * 0.50, ih * 0.26, ih * 0.035, 0, TAU); x.fill();
      // 标签 + 录制点
      x.fillStyle = 'rgba(150,224,200,0.85)';
      x.font = '600 17px "Consolas",monospace'; x.textAlign = 'left'; x.textBaseline = 'top';
      x.fillText('REAR CAM 04', 8, 7);
      if (Math.floor(f / 8) % 2 === 0) { x.fillStyle = 'rgba(255,70,58,0.95)'; x.beginPath(); x.arc(iw - 14, 14, 5, 0, TAU); x.fill(); }
    }
  }, 0.94);
  // 屏幕冷光溢出（③ 加重，把注意力引过去）
  const c = proj((x0 + x1) / 2, 1.22, 2.20);
  if (c) { sctx.save(); sctx.globalCompositeOperation = 'lighter';
    glowAt(c.x, c.y, 0.62 * c.s, 0.40 * c.s, glow('rgba(90,190,160,A)'), 0.10 + 0.16 * hot); sctx.restore(); }
}

/* ============================================================================
   scene1
   ========================================================================== */
/* 数据流速度：⑤ 按下后加速（纯函数，分段斜率；⑩ 停手后回落到常速） */
function scr(f) {
  const t = Math.min(f, K.pressEnd);
  return 0.5 * f + 1.4 * Math.max(0, t - K.press);
}

/* ⑩ 整个场景化成蓝色发光体：先铺深蓝把陈设吃掉，再叠三层蓝辉光 */
function blueField(f) {
  const bk = blueK(f); if (bk <= 0.002) return;
  sctx.save();                                   // 深蓝底
  sctx.globalAlpha = Math.min(1, bk * 1.10);
  sctx.fillStyle = '#0d2a5c';
  sctx.fillRect(0, 0, W, H);
  sctx.restore();
  const c = proj(EYE.x, EYE.y, EYE.z);
  const cx = c ? c.x : W / 2, cy = c ? c.y : H / 2;
  sctx.save(); sctx.globalCompositeOperation = 'lighter';   // 发光体感
  glowAt(cx, cy, W * 1.15, H * 1.15, glow('rgba(56,132,255,A)'), 0.62 * bk);
  glowAt(cx, cy, W * 0.56, H * 0.56, glow('rgba(118,190,255,A)'), 0.56 * bk);
  glowAt(cx, cy, W * 0.22, H * 0.22, glow('rgba(200,232,255,A)'), 0.42 * bk);
  sctx.restore();
}

function scene1(f) {
  curF = f;
  const lit = roomLit(f), bk = blueK(f), dk = darkK(f);
  clearScene('#05070a');
  if (!ROAM) camBeat(f);

  if (lit > 0.02) {
    // 空间冷雾光（⑨ 转红）
    const rf = redFlood(f);
    sctx.save(); sctx.globalCompositeOperation = 'lighter';
    glowAt(W * 0.5, H * 0.42, W * 0.9, H * 0.6,
      glow(rf > 0.002 ? 'rgba(120,30,22,A)' : 'rgba(58,84,106,A)'), (0.18 + 0.10 * rf) * lit);
    sctx.restore();

    drawCeiling(f);
    drawWalls(f);
    drawScreenWall(f);
    drawFloor(f);
    drawDebris(f);
    drawCables(f);          // 次级触手（在眼球后方，先画）
    if (bk > 0.01) {
      // ⑩ 整个场景化成蓝色发光体 —— 陈设全被蓝光吞掉，只剩眼珠子还留着
      blueField(f);
      drawEyeball(f);
    } else {
      drawEyeball(f);         // 主体
      drawLegs(f);            // 主触手（在眼球前方，后画）
      drawConsole(f);         // 前景操作台
      drawRearMonitor(f);     // 后方监控屏（②③ 映背影与眼球剪影 / ④⑥⑦ 打出三个词）
      drawButtons(f);         // 按钮面板：左右幻影 + 中央真按钮
      drawHands(f);           // 「你」的手（世界空间伪 3D，压在最前）

      // 前景悬浮尘埃
      sctx.save();
      for (let i = 0; i < 70; i++) {
        const sx = srnd(i * 2.7) * W, sy = ((srnd(i * 5.3) + f * 0.0016 * (0.4 + srnd(i * 3.9))) % 1) * H;
        sctx.globalAlpha = (0.06 + 0.10 * srnd(i * 8.1)) * lit;
        sctx.fillStyle = 'rgba(190,205,215,1)'; sctx.fillRect(sx, sy, 1.6, 1.6);
      }
      sctx.restore();
    }
  }
  if (lit < 0.995) {        // ⑩ 熄灯后：整间压黑（保证字幕底纯黑）
    sctx.save(); sctx.globalAlpha = 1 - lit; sctx.fillStyle = '#030406';
    sctx.fillRect(0, 0, W, H); sctx.restore();
  }
  if (dk > 0.002) {         // ⑩ 连眼珠子一起缓慢变暗到全黑
    sctx.save(); sctx.globalAlpha = dk; sctx.fillStyle = '#02040a';
    sctx.fillRect(0, 0, W, H); sctx.restore();
  }

  // HUD（仅幕1–2；漫游时长亮）
  const a = ROAM ? 0.85 : smoothstep(24, 52, f) * (1 - smoothstep(B.blink1[0], B.blink1[0] + 28, f));
  drawHUD('LAB · B3', a * 0.80, 150, 60);
  drawHUD('EYE-UNIT 01 / FRAMING', a * 0.55, 150, 96);
  drawHUD('LINK: LOCKED', a * 0.80, W - 430, 60, 'rgba(230,120,100,0.9)');

  /* ---------- 字幕 ---------- */
  // ① 机械眼球台词：从画面中间弹出（淡入 + 上浮 + 打字机），两句严格接力不叠字
  if (f < B.buttons[1]) {
    const a1 = fadeK(f, 40, 50, 96, 106);
    if (a1 > 0.01) drawSub('eye1', W / 2, H * 0.60 + (1 - a1) * 18, typeK(f, 'eye1', 42, 2.2), a1);
    const a2 = fadeK(f, 106, 116, 148, 160);
    if (a2 > 0.01) drawSub('eye2', W / 2, H * 0.60 + (1 - a2) * 18, typeK(f, 'eye2', 108, 2.2), a2);
  }
  // ⑩ 眼球平静下来说的那句「谢谢」（中间，同一副金属口吻）
  if (f >= 684 && f < 744) {
    const at = fadeK(f, 686, 694, 726, 738);
    if (at > 0.01) drawSub('thanks', W / 2, H * 0.60 + (1 - at) * 16, typeK(f, 'thanks', 690, 4.0), at);
  }
  // ⑪ 你选左还是右？
  if (f >= B.qSub[0] - 4 && f < B.black[1] + 6) {
    drawSub('q', W / 2, H - 150, typeK(f, 'q', B.qSub[0] + 6, 2.6),
      fadeK(f, B.qSub[0] + 4, B.qSub[0] + 14, B.qSub[1] - 9, B.qSub[1]));
  }
  // ⑭ 点题：两行同屏，淡入 → 停留 ~5s → 淡出
  if (f >= B.explain[0] - 4) {
    const aA = fadeK(f, 830, 844, 928, 942);
    if (aA > 0.01) {
      drawSub('exp1', W / 2, 470, 1, aA);
      drawSub('exp2', W / 2, 566, 1, aA);
    }
  }
  // ⑮ 收尾：两行同屏
  if (f >= B.end[0] - 4) {
    const aB = fadeK(f, 950, 964, 985, 999);
    if (aB > 0.01) {
      drawSub('end1', W / 2, 470, 1, aB);
      drawSub('end2', W / 2, 566, 1, aB);
    }
  }
  // ⑬ 标题卡（最后才弹）：整块淡入 + 轻微放大落定，一直留到片尾淡出
  if (f >= B.title[0] + 3) {
    const pop = easeOutCubic(clamp((f - B.title[0] - 3) / 16, 0, 1));
    const ts = lerp(0.90, 1.0, pop);
    drawTitleBlock(W / 2, 540 - 130 * ts, ts, smoothstep(B.title[0] + 3, B.title[0] + 22, f));
  }

  /* ---------- ② 中间弹出的 2D 绿字屏 ---------- */
  drawSelectPanel(f);

  /* ---------- 眨眼 = 全屏金属快门（盖在所有内容之上） ---------- */
  drawShutter(f);
}

/* ---------- 后处理参数（按幕递增撕裂，幕3 收干净保证字幕清晰） ---------- */
const POST1 = { curve: 0.05, chroma: 0.09, scan: 0.30, grain: 0.045, glitch: 0.03, grade: -0.10, vig: 0.30, wobble: 0.003, fade: 1 };
function postParams(f) {
  const p = Object.assign({ frame: f }, POST1);
  const act2 = smoothstep(B.pressLeft[0] - 30, B.pressLeft[0] + 30, f) * (1 - smoothstep(B.thanks[1] + 14, B.thanks[1] + 40, f));
  const wild = laughK(f);                                                 // ⑨ 笑声：失控段
  const act3 = smoothstep(B.thanks[1] + 14, B.thanks[1] + 40, f);         // 幕3 黑底字幕：收干净
  const mix = (a, b) => lerp(a, b, act2);
  p.chroma  = mix(0.09, 0.16) + 0.08 * wild;
  p.glitch  = mix(0.03, 0.06) + 0.05 * wild;
  p.grain   = mix(0.045, 0.070);
  p.scan    = mix(0.30, 0.34);
  p.grade   = mix(-0.10, -0.14);
  p.vig     = mix(0.30, 0.36);
  p.wobble  = mix(0.003, 0.006) + 0.006 * wild;
  // 幕3：干净
  p.chroma = lerp(p.chroma, 0.02, act3);
  p.glitch = lerp(p.glitch, 0.0, act3);
  p.grain  = lerp(p.grain, 0.016, act3);
  p.scan   = lerp(p.scan, 0.22, act3);
  p.grade  = lerp(p.grade, -0.02, act3);
  p.vig    = lerp(p.vig, 0.26, act3);
  p.wobble = lerp(p.wobble, 0.0, act3);
  p.curve  = lerp(0.05, 0.03, act3);
  p.fade = ROAM ? 1 : subA(f, 0, 8, TOTAL_FRAMES - 14, TOTAL_FRAMES);
  return p;
}

/* ---------- 对外接口 ---------- */
window.renderFrame = function (f) {
  scene1(f);
  post(postParams(f));
  dctx.clearRect(0, 0, W, H);
  dctx.drawImage(glC, 0, 0);
};

/* ============================================================================
   交互漫游模式（?roam=1）—— 预览用，不参与出片
   WASD 移动 / Q E 升降 / Shift 加速 / 鼠标拖拽转视角 / [ ] 逐帧 / Space 播放暂停 / R 复位
   ========================================================================== */
let roamF = window.__frame || 0, roamPlay = true, roamLast = 0;
const keyDown = {};
function roamReset() { CAM.x = 0; CAM.y = 1.32; CAM.z = 0.60; CAM.pitch = 0.02; CAM.yaw = 0; }
function initRoam() {
  roamReset();
  window.addEventListener('keydown', e => {
    keyDown[e.code] = true;
    if (e.code === 'Space') { roamPlay = !roamPlay; e.preventDefault(); }
    if (e.code === 'KeyR') roamReset();
    if (e.code === 'BracketLeft') { roamF = (roamF - 4 + TOTAL_FRAMES) % TOTAL_FRAMES; roamPlay = false; }
    if (e.code === 'BracketRight') { roamF = (roamF + 4) % TOTAL_FRAMES; roamPlay = false; }
  });
  window.addEventListener('keyup', e => { keyDown[e.code] = false; });
  let drag = false, lx = 0, ly = 0;
  disp.style.cursor = 'crosshair';
  disp.addEventListener('mousedown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
  window.addEventListener('mouseup', () => { drag = false; });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    CAM.yaw += (e.clientX - lx) * 0.0022;
    CAM.pitch = clamp(CAM.pitch + (e.clientY - ly) * 0.0022, -0.95, 0.95);
    lx = e.clientX; ly = e.clientY;
  });
  requestAnimationFrame(roamTick);
}
function roamTick(ts) {
  const dt = Math.min(0.05, roamLast ? (ts - roamLast) / 1000 : 0.016); roamLast = ts;
  if (roamPlay) roamF = (roamF + dt * 30) % TOTAL_FRAMES;
  const sp = 2.6 * dt * ((keyDown['ShiftLeft'] || keyDown['ShiftRight']) ? 2.6 : 1);
  const yw = CAM.yaw;
  const F = { x: Math.sin(yw), z: Math.cos(yw) }, Rt = { x: Math.cos(yw), z: -Math.sin(yw) };
  let mx = 0, mz = 0;
  if (keyDown['KeyW']) { mx += F.x; mz += F.z; }
  if (keyDown['KeyS']) { mx -= F.x; mz -= F.z; }
  if (keyDown['KeyD']) { mx += Rt.x; mz += Rt.z; }
  if (keyDown['KeyA']) { mx -= Rt.x; mz -= Rt.z; }
  const len = Math.hypot(mx, mz);
  if (len > 0.001) { CAM.x += mx / len * sp; CAM.z += mz / len * sp; }
  if (keyDown['KeyE']) CAM.y += sp;
  if (keyDown['KeyQ']) CAM.y -= sp;
  CAM.x = clamp(CAM.x, -RW + 0.25, RW - 0.25);
  CAM.y = clamp(CAM.y, 0.25, RH - 0.15);
  CAM.z = clamp(CAM.z, 0.35, FAR - 0.6);

  renderFrame(roamF | 0);
  dctx.save();
  dctx.strokeStyle = 'rgba(190,235,255,0.75)'; dctx.lineWidth = 2;
  dctx.beginPath(); dctx.moveTo(W / 2 - 12, H / 2); dctx.lineTo(W / 2 + 12, H / 2);
  dctx.moveTo(W / 2, H / 2 - 12); dctx.lineTo(W / 2, H / 2 + 12); dctx.stroke();
  dctx.font = '500 24px "Consolas",monospace'; dctx.fillStyle = 'rgba(180,235,255,0.92)';
  dctx.textAlign = 'left'; dctx.textBaseline = 'alphabetic';
  dctx.fillText('ROAM  WASD 移动 · Q/E 升降 · Shift 加速 · 鼠标拖拽转视角 · [ ] 逐帧 · Space 播放/暂停 · R 复位', 40, H - 92);
  dctx.fillText(`CAM x=${CAM.x.toFixed(2)} y=${CAM.y.toFixed(2)} z=${CAM.z.toFixed(2)}   pitch=${(CAM.pitch * 57.3).toFixed(1)}°  yaw=${(CAM.yaw * 57.3).toFixed(1)}°`, 40, H - 60);
  dctx.fillText(`FRAME ${roamF | 0} / ${TOTAL_FRAMES}   ${roamPlay ? 'PLAY' : 'PAUSE'}`, 40, H - 28);
  dctx.restore();
  requestAnimationFrame(roamTick);
}

if (ROAM) initRoam();
else window.renderFrame(window.__frame);
window.__renderDone = true;
</script>
