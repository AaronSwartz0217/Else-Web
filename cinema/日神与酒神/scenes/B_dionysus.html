<!doctype html>
<html lang="zh">
<head><meta charset="UTF-8"><title>日神与酒神 · ② 酒神 · 夜里的狂欢（600–1200）</title></head>
<body>
<script src="../vendor/webgl3d-pipeline/webgl3d_pipeline.js"></script>
<script src="../../共享资源/roam.js"></script>
<script src="common.js"></script>
<script>
'use strict';
/* ============================================================================
   ② 酒神 · 夜里的狂欢（源帧 600–1200 · 20s）
   夜里的山林空地：火堆 + 八支火把 + 三只酒桶 + 调酒缸 + 树上挂的六张面具 + 藤蔓
   + 十四名舞者 + 四个萨提尔（羊腿羊角，尼采原文里"歌队的原型"）+ 两个举手的人。
   酒神 = 醉 = 音乐 = 边界融化 → 本场纪律：**人影互相重叠、光晕互相吃掉彼此的边**。
   配色纪律：只用**火橙 / 琥珀 / 苔绿 / 深夜紫黑**——**不出现任何酒红族颜色**
   （那一族整族留给最后的点题卡，闸门要靠"主题色只在标题"判）。
   ========================================================================== */
const { srnd, TAU, clamp, lerp, smoothstep, subA, seq } = DION;
function plane1(app, GL3D) { return app.createMesh(GL3D.Geometry.plane(1, 1)); }

DION.boot({
  range: [600, 1200],
  clearColor: [0.05, 0.045, 0.075, 1],
  near: 0.22, far: 220,

  camk: [
    { f: 600, eye: [0.00, 2.30, -3.20], tgt: [0.60, 1.60, 12.0], focal: 1150 },   // 从日神的正午走到夜里
    { f: 700, eye: [0.10, 2.00, 1.20], tgt: [0.40, 1.50, 12.5], focal: 1200 },   // b1 落定 · 火把亮起
    { f: 840, eye: [1.30, 1.78, 5.60], tgt: [-2.20, 1.30, 13.0], focal: 1250 },   // b2 走进人群（低机位）
    { f: 990, eye: [0.60, 3.70, 4.40], tgt: [-1.60, 0.90, 14.5], focal: 1150 },   // b3 拔高：看整片浪
    { f: 1090, eye: [0.20, 2.60, 7.60], tgt: [-2.60, 1.40, 14.5], focal: 1180 },   // 降回来，推向火堆
    { f: 1200, eye: [-0.20, 2.10, 10.60], tgt: [-3.00, 1.70, 15.0], focal: 1150 },
  ],
  /* 夜里的火：唯一光源就是它（火光从火堆方向来，所以人影的暖轮廓都朝着火） */
  light: [
    { f: 600, amb: [0.15, 0.12, 0.19], col: [0.96, 0.54, 0.24], dir: [0.20, -0.44, -0.87] },
    { f: 900, amb: [0.17, 0.13, 0.21], col: [1.00, 0.60, 0.28], dir: [0.20, -0.44, -0.87] },
    { f: 1200, amb: [0.14, 0.11, 0.18], col: [0.92, 0.50, 0.22], dir: [0.20, -0.44, -0.87] },
  ],
  /* 酒神段后处理：**暗、颗粒重、色差大**（"醉"） */
  post: {
    exp: [[0, 0.72], [60, 0.92], [900, 0.95], [1200, 0.90]],
    con: [[0, 1.06], [1200, 1.06]],
    sat: [[0, 0.98], [200, 1.12], [1200, 1.10]],
    vig: [[0, 0.58], [400, 0.50], [1200, 0.52]],
    grain: [[0, 0.050], [1200, 0.044]],
    chr: [[0, 0.0008], [300, 0.0016], [1200, 0.0014]],
  },
  kicker: { act: 1, from: 600, to: 1200, main: '02 / 03 · 酒神', sub: 'DIONYSUS · 夜里的狂欢 · 醉与融化' },
  caps: [
    { s: 628, e: 698, t: '但这片光有代价：它把人和世界分开了。', kw: '代价', kc: 'brass', a: [3.00, 2.60, 14.5], lx: 960, ly: 214, size: 46, align: 'c' },
    { s: 704, e: 774, t: '尼采的第二个答案，叫酒神。', kw: '酒神', kc: 'brass', a: [3.00, 1.30, 14.5], lx: 960, ly: 214, size: 46, align: 'c' },
    { s: 782, e: 852, t: '「酒神」就是醉——是音乐、是鼓、是舞。', kw: '醉', kc: 'brass', a: [-2.20, 1.30, 13.0], lx: 960, ly: 214, size: 46, align: 'c' },
    { s: 858, e: 928, t: '醉了以后，边界开始融化。', kw: '融化', kc: 'brass', a: [-1.00, 1.20, 12.0], lx: 960, ly: 880, size: 46, align: 'c' },
    { s: 936, e: 1006, t: '你分不清自己从哪儿开始，别人在哪儿结束。', kw: '分不清', kc: 'brass', a: [-2.60, 1.10, 13.5], lx: 960, ly: 880, size: 46, align: 'c' },
    { s: 1012, e: 1082, t: '你不再是「一个」人，而是一整片浪。', kw: '一整片浪', kc: 'brass', a: [0.00, 1.60, 15.0], lx: 960, ly: 880, size: 46, align: 'c' },
    { s: 1088, e: 1158, t: '那一刻你又怕、又快乐得快要炸开。', kw: '快乐得快要炸开', kc: 'brass', a: [3.00, 1.50, 14.5], lx: 960, ly: 214, size: 46, align: 'c' },
  ],
  roam: {
    clamp: c => { c.x = DION.clamp(c.x, -13.0, 13.0); c.y = DION.clamp(c.y, 0.45, 9.5); c.z = DION.clamp(c.z, -3.5, 30.0); },
    hud: '夜里的狂欢 42 × 40 m · 火堆 · 八支火把 · 十四名舞者 · 四个萨提尔',
  },

  build: function (app, T, GL3D) {
    const items = [], DYN = {};
    const M_ = app.createMaterial, M = (p, r, s) => GL3D.Mat4.trs(p || [0, 0, 0], r || [0, 0, 0], s || [1, 1, 1]);
    const I = () => GL3D.Mat4.identity();
    const tex = c => app.createTexture(c);
    const boxAt = (w, h, d, x, y, z, rot) => T.boxAt(GL3D, w, h, d, x, y, z, rot);
    const FIRE = [3.00, 14.50];

    /* ---- 夜空（**星点直接烘进不透明天空盒**，别做成半透明层——否则会透过后面的树冠人影） ---- */
    DYN.sky = {
      name: 'sky', mesh: plane1(app, GL3D), billboard: true, position: [0, 9, 120], scale: [352, 198, 1],
      material: M_({
        texture: tex(T.mk(1024, 1024, (g, w, h) => {
          const lg = g.createLinearGradient(0, 0, 0, h);
          lg.addColorStop(0.00, '#070911'); lg.addColorStop(0.50, '#131024');
          lg.addColorStop(0.82, '#241A2A'); lg.addColorStop(1.00, '#3A2430');
          g.fillStyle = lg; g.fillRect(0, 0, w, h);
          for (let i = 0; i < 340; i++) {
            const x = srnd(i * 3.9) * w, y = srnd(i * 8.3) * h * 0.86, r = 0.55 + srnd(i * 6.1) * 0.75;
            g.fillStyle = 'rgba(226,236,255,' + (0.18 + 0.42 * srnd(i * 4.3)).toFixed(3) + ')';
            g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
          }
        })), unlit: true, alphaMode: 'mask', alphaCutoff: 0.02, doubleSided: true,
      }),
    };
    items.push(DYN.sky);
    const moonGlow = tex(T.makeGlow('rgba(226,236,255,0.95)', 'rgba(180,200,240,0.30)', 256));
    items.push({ name: 'moon', mesh: plane1(app, GL3D), billboard: true, position: [-34, 26, 96], scale: [5.0, 5.0, 1], material: M_({ texture: moonGlow, alphaMode: 'blend', unlit: true, depthWrite: false }) });
    const hillTex = tex(T.mk(512, 200, (g, w, h) => {
      g.clearRect(0, 0, w, h);
      g.fillStyle = 'rgba(14,12,20,0.92)';
      g.beginPath(); g.moveTo(0, h);
      for (let x = 0; x <= w; x += 16) g.lineTo(x, h - 52 - 30 * Math.sin(x * 0.010) - 18 * srnd(x * 0.17));
      g.lineTo(w, h); g.closePath(); g.fill();
      g.fillStyle = 'rgba(9,8,13,0.95)';
      g.beginPath(); g.moveTo(0, h);
      for (let x = 0; x <= w; x += 16) g.lineTo(x, h - 22 - 16 * Math.sin(x * 0.021 + 1.4) - 12 * srnd(x * 0.29));
      g.lineTo(w, h); g.closePath(); g.fill();
    }));
    items.push({ name: 'hills', mesh: plane1(app, GL3D), billboard: true, position: [0, 4, 70], scale: [150, 34, 1], material: M_({ texture: hillTex, alphaMode: 'mask', alphaCutoff: 0.05, unlit: true, doubleSided: true }) });
    const warmGlow = tex(T.makeGlow('rgba(255,196,110,0.95)', 'rgba(255,140,50,0.35)', 256));
    items.push({ name: 'farFire', mesh: plane1(app, GL3D), billboard: true, position: [-52, 3.4, 66], scale: [16, 12, 1], material: M_({ texture: warmGlow, alphaMode: 'blend', unlit: true, depthWrite: false, color: [1, 0.8, 0.5, 0.55] }) });

    /* ---- 山地地面（深色土：**不烘亮颗粒**——否则会在暗场里变成一层"雪花"） ---- */
    const earthTex = tex(T.mk(512, 512, (g, w, h) => {
      g.fillStyle = '#332C24'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 700; i++) {
        const x = srnd(i * 4.7) * w, y = srnd(i * 9.3) * h, r = 6 + srnd(i * 3.1) * 26;
        g.fillStyle = i % 3 ? 'rgba(24,20,16,0.30)' : 'rgba(58,50,40,0.24)';
        g.beginPath(); g.ellipse(x, y, r, r * 0.7, srnd(i * 2.3), 0, TAU); g.fill();
      }
      g.strokeStyle = 'rgba(20,17,14,0.45)'; g.lineWidth = 2;
      for (let i = 0; i < 26; i++) {
        const y = srnd(i * 6.1) * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + (srnd(i * 2.7) - 0.5) * 22); g.stroke();
      }
    }));
    items.push({ name: 'ground', mesh: app.createMesh(GL3D.Geometry.ground(44, 42)), material: M_({ color: [1, 1, 1, 1], texture: earthTex }), model: M([0, 0, 14]) });
    items.push({
      name: 'rocks', mesh: T.mergeParts(app, GL3D, [
        boxAt(1.6, 0.7, 1.2, -8.0, 0.32, 8.0, [0, 0.3, 0]), boxAt(1.1, 0.5, 0.9, 7.4, 0.24, 19.0, [0, -0.4, 0]),
        boxAt(2.0, 0.6, 1.4, -6.2, 0.28, 21.0, [0, 0.8, 0]), boxAt(0.9, 0.44, 0.8, 8.6, 0.20, 9.5, [0, 0.2, 0]),
      ]), material: M_({ color: [0.34, 0.32, 0.30, 1] }), model: I(),
    });

    /* ---- 树干（十二根：树皮纹理 + **避开镜头走廊**）+ 树冠（五片，抬高收小）+ 灌木 ---- */
    const trunks = [];
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU + 0.4;
      const r = 9.5 + srnd(i * 3.7) * 3.5;
      let x = Math.cos(a) * r, z = 14.5 + Math.sin(a) * r * 0.85;
      if (Math.abs(x) < 7.5 && z < 15.0) {                    // 别让树干挡在进场镜头的走廊里
        const sg = x >= 0 ? 1 : -1;
        x = sg * (7.6 + srnd(i * 2.9) * 3.4);
        z = 15.0 + srnd(i * 4.7) * 6.0;
      }
      trunks.push(T.cylAt(GL3D, 0.42, 6.2, x, 3.1, z, 10));
    }
    const barkTex = tex(T.mk(128, 512, (g, w, h) => {
      g.fillStyle = '#2A2119'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 90; i++) {
        const x = srnd(i * 3.1) * w, ww = 2 + srnd(i * 5.3) * 6, y0 = srnd(i * 7.9) * h * 0.6;
        g.fillStyle = i % 3 ? 'rgba(48,38,28,0.85)' : 'rgba(16,12,10,0.85)';
        g.fillRect(x, y0, ww, h * (0.3 + srnd(i * 2.3) * 0.6));
      }
    }));
    items.push({ name: 'trunks', mesh: T.mergeParts(app, GL3D, trunks), material: M_({ color: [1, 1, 1, 1], texture: barkTex }), model: I() });
    const canopyTex = tex(T.makeCanopy('#1C2A1A', '#0E1810'));
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU + 0.9, r = 9.0;
      items.push({ name: 'canopy' + i, mesh: plane1(app, GL3D), billboard: true, position: [Math.cos(a) * r, 8.6 + srnd(i * 4.1) * 1.4, 14.5 + Math.sin(a) * r], scale: [12, 7.6, 1], material: M_({ texture: canopyTex, alphaMode: 'blend', depthWrite: false, unlit: true, color: [0.85, 0.85, 0.85, 0.72] }) });
    }
    for (let i = 0; i < 6; i++) {
      const x = (i % 2 ? 1 : -1) * (5.0 + srnd(i * 6.3) * 3.4), z = 7.0 + (i * 2.6) % 16;
      items.push({ name: 'bush' + i, mesh: plane1(app, GL3D), billboard: true, position: [x, 0.85, z], scale: [3.0, 2.0, 1], material: M_({ texture: canopyTex, alphaMode: 'blend', depthWrite: false, unlit: true, color: [0.8, 0.85, 0.8, 0.78] }) });
    }

    /* ---- 火堆：三层火焰 + 地面辉光 + 大光晕 + 柴堆 ---- */
    const flameTex = tex(T.makeFlame());
    items.push({ name: 'logs', mesh: T.mergeParts(app, GL3D, [
      T.cylAt(GL3D, 0.22, 3.2, FIRE[0], 0.22, FIRE[1], 8), T.cylAt(GL3D, 0.20, 3.0, FIRE[0] + 0.5, 0.20, FIRE[1] - 0.4, 8),
      T.cylAt(GL3D, 0.20, 3.0, FIRE[0] - 0.6, 0.20, FIRE[1] + 0.5, 8), T.cylAt(GL3D, 0.18, 2.6, FIRE[0], 0.18, FIRE[1] - 0.8, 8),
    ]), material: M_({ color: [0.28, 0.18, 0.12, 1], }), model: I() });
    DYN.flames = [];
    for (let i = 0; i < 3; i++) {
      const it = {
        name: 'flame' + i, mesh: plane1(app, GL3D), billboard: true,
        position: [FIRE[0] + (i - 1) * 0.28, 1.30 + i * 0.42, FIRE[1] + (i - 1) * 0.16],
        scale: [3.4 - i * 0.95, 5.2 - i * 1.4, 1],
        material: M_({ texture: flameTex, alphaMode: 'blend', depthWrite: false, unlit: true, color: [1, 1, 1, 0.90 - i * 0.12] }),
      };
      items.push(it); DYN.flames.push(it);
    }
    DYN.fireHalo = { name: 'fireHalo', mesh: plane1(app, GL3D), billboard: true, position: [FIRE[0], 2.0, FIRE[1]], scale: [14, 12, 1], material: M_({ texture: warmGlow, alphaMode: 'blend', depthWrite: false, unlit: true, color: [1, 0.72, 0.42, 0.18] }) };
    items.push(DYN.fireHalo);
    items.push({ name: 'firePool', mesh: plane1(app, GL3D), model: M([FIRE[0], 0.03, FIRE[1]], [-Math.PI / 2, 0, 0], [13, 13, 1]), material: M_({ texture: warmGlow, alphaMode: 'blend', depthWrite: false, unlit: true, color: [1, 0.68, 0.38, 0.34] }) });

    /* ---- 八支火把（杆合并 + 焰 + 光晕） ---- */
    const poles = [];
    DYN.torchFlame = [];
    DYN.torchGlow = [];
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + 0.25, r = 8.4;
      const x = Math.cos(a) * r, z = 14.5 + Math.sin(a) * r;
      poles.push(T.cylAt(GL3D, 0.09, 3.05, x, 1.52, z, 6));
      const f = {
        name: 'tFlame' + i, mesh: plane1(app, GL3D), billboard: true, position: [x, 3.35, z], scale: [1.1, 1.7, 1],
        material: M_({ texture: flameTex, alphaMode: 'blend', depthWrite: false, unlit: true, color: [1, 1, 1, 0.95] }),
      };
      const g = {
        name: 'tGlow' + i, mesh: plane1(app, GL3D), billboard: true, position: [x, 3.30, z], scale: [4.4, 4.4, 1],
        material: M_({ texture: warmGlow, alphaMode: 'blend', depthWrite: false, unlit: true, color: [1, 0.76, 0.46, 0.22] }),
      };
      items.push(f, g); DYN.torchFlame.push(f); DYN.torchGlow.push(g);
    }
    items.push({ name: 'torchPoles', mesh: T.mergeParts(app, GL3D, poles), material: M_({ color: [0.30, 0.22, 0.16, 1] }), model: I() });

    /* ---- 三只酒桶 + 调酒缸 ---- */
    const barrels = [];
    for (const b of [[-4.6, 10.4], [-5.6, 11.6], [-3.4, 12.2]]) {
      barrels.push(T.cylAt(GL3D, 0.62, 1.30, b[0], 0.65, b[1], 12));
      barrels.push(T.cylAt(GL3D, 0.66, 0.12, b[0], 1.32, b[1], 12));
      barrels.push(T.cylAt(GL3D, 0.65, 0.10, b[0], 0.20, b[1], 12));
    }
    items.push({ name: 'barrels', mesh: T.mergeParts(app, GL3D, barrels), material: M_({ color: [0.32, 0.22, 0.14, 1] }), model: I() });
    items.push({
      name: 'krater', mesh: T.mergeParts(app, GL3D, [
        T.cylAt(GL3D, 0.72, 0.80, 1.2, 0.44, 12.0, 14), T.cylAt(GL3D, 0.86, 0.16, 1.2, 0.92, 12.0, 14),
        T.cylAt(GL3D, 0.30, 0.22, 1.2, 0.10, 12.0, 14),
      ]), material: M_({ color: [0.36, 0.28, 0.20, 1] }), model: I(),
    });

    /* ---- 树上挂的六张面具 + 三条藤蔓 ---- */
    DYN.maskTex = [];
    for (let i = 0; i < 4; i++) DYN.maskTex.push(tex(T.makeMask(i)));
    DYN.masks = [];
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU + 1.1, r = 8.6;
      const it = {
        name: 'mask' + i, mesh: plane1(app, GL3D), billboard: true,
        position: [Math.cos(a) * r, 2.75 + (i % 2) * 0.5, 14.5 + Math.sin(a) * r],
        scale: [0.78, 0.98, 1],
        material: M_({ texture: DYN.maskTex[i % 4], alphaMode: 'blend', depthWrite: false, unlit: true, color: [0.66, 0.56, 0.44, 0.95] }),
      };
      items.push(it); DYN.masks.push(it);
    }
    const vineTex = tex(T.mk(512, 128, (g, w, h) => {
      g.clearRect(0, 0, w, h);
      g.strokeStyle = 'rgba(38,52,30,0.95)'; g.lineWidth = 5;
      g.beginPath(); g.moveTo(0, h * 0.5); g.bezierCurveTo(w * 0.3, h * 0.1, w * 0.6, h * 0.9, w, h * 0.45); g.stroke();
      for (let i = 0; i < 90; i++) {
        const x = srnd(i * 2.7) * w, y = h * 0.5 + (srnd(i * 5.1) - 0.5) * h * 0.8;
        g.fillStyle = i % 3 ? '#2E4224' : '#3E5A2E';
        g.globalAlpha = 0.6 + 0.4 * srnd(i * 3.3);
        g.beginPath(); g.ellipse(x, y, 9 + srnd(i * 7.7) * 8, 6, srnd(i * 1.9), 0, TAU); g.fill();
      }
      g.globalAlpha = 1;
    }));
    for (let i = 0; i < 3; i++) {
      const V = [[-7.6, 3.3, 21.0], [7.4, 3.9, 9.6], [0.6, 4.3, 24.4]][i];
      items.push({ name: 'vine' + i, mesh: plane1(app, GL3D), billboard: true, position: V, scale: [7.5, 1.9, 1], material: M_({ texture: vineTex, alphaMode: 'blend', depthWrite: false, unlit: true, color: [0.9, 0.95, 0.9, 0.9] }) });
    }

    /* ---- 祭坛（火堆旁） ---- */
    items.push({
      name: 'altar', mesh: T.mergeParts(app, GL3D, [
        boxAt(2.0, 0.86, 1.2, 5.6, 0.43, 12.4, [0, 0.4, 0]), boxAt(2.3, 0.16, 1.5, 5.6, 0.94, 12.4, [0, 0.4, 0]),
      ]), material: M_({ color: [0.32, 0.30, 0.28, 1] }), model: I(),
    });

    /* ---- 人物：14 舞者 + 4 萨提尔 + 2 举手 ---- */
    const dancePal = {
      body: '#2A2430', coat: '#332C3A', coatTop: '#453C4C', coatBot: '#1C1622',
      fold: 'rgba(20,16,22,0.8)', rim: '#FFB060', rimA: 0.75, flare: 0.030, skirt: 0.360,
      legW: 0.056, armW: 0.046, shade: 'rgba(12,10,14,1)', shadeA: 0.4,
    };
    const satyrPal = Object.assign({}, dancePal, { body: '#241E28', coat: '#2C2432', goat: true, goatCol: '#221C26', rim: '#FFC070', rimA: 0.82, skirt: 0.340 });
    DYN.danceTex = [], DYN.satyrTex = [], DYN.raiseTex = [];
    for (let i = 0; i < 12; i++) DYN.danceTex.push(tex(T.mk(T.FIG_W, T.FIG_H, (g, w, h) => T.paintFigure(g, w, h, 'dance', i, dancePal))));
    for (let i = 0; i < 6; i++) DYN.satyrTex.push(tex(T.mk(T.FIG_W, T.FIG_H, (g, w, h) => T.paintFigure(g, w, h, 'dance', i, satyrPal))));
    for (let i = 0; i < 6; i++) DYN.raiseTex.push(tex(T.mk(T.FIG_W, T.FIG_H, (g, w, h) => T.paintFigure(g, w, h, 'raise', i, dancePal))));

    DYN.dancers = [];
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * TAU + 0.7, r = 2.6 + srnd(i * 4.3) * 6.4;
      const x = Math.cos(a) * r, z = 14.5 + Math.sin(a) * r * 0.9;
      const hgt = 1.62 + srnd(i * 7.1) * 0.30;
      const it = { name: 'dancer' + i, mesh: plane1(app, GL3D), billboard: true, position: [x, hgt / 2, z], scale: [hgt * (T.FIG_W / T.FIG_H), hgt, 1], material: M_({ texture: DYN.danceTex[i % 12], alphaMode: 'blend', depthWrite: true, unlit: true }), seed: i, base: [x, hgt / 2, z], hgt };
      items.push(it); DYN.dancers.push(it);
    }
    DYN.satyrs = [];
    for (let i = 0; i < 4; i++) {
      const x = -6.4 + i * 1.9, z = 10.6 + (i % 2) * 2.4;
      const it = { name: 'satyr' + i, mesh: plane1(app, GL3D), billboard: true, position: [x, 0.92, z], scale: [1.14, 1.72, 1], material: M_({ texture: DYN.satyrTex[i % 6], alphaMode: 'blend', depthWrite: true, unlit: true }), seed: i, base: [x, 0.92, z] };
      items.push(it); DYN.satyrs.push(it);
    }
    DYN.raisers = [];
    for (let i = 0; i < 2; i++) {
      const it = { name: 'raiser' + i, mesh: plane1(app, GL3D), billboard: true, position: [0.4 + i * 1.6, 0.93, 17.4], scale: [1.13, 1.74, 1], material: M_({ texture: DYN.raiseTex[0], alphaMode: 'blend', depthWrite: true, unlit: true }), seed: i + 20, base: [0.4 + i * 1.6, 0.93, 17.4] };
      items.push(it); DYN.raisers.push(it);
    }

    return { items, DYN };
  },

  update: function (f, ctx) {
    const { DYN } = ctx, T = DION;
    const cam = ctx.CAM, f3 = T.fwdOf(cam.yaw, cam.pitch), D = 120;
    DYN.sky.position = [cam.x + f3[0] * D, cam.y + f3[1] * D, cam.z + f3[2] * D];

    /* 火光跳动（纯函数）：同时驱动火焰尺度、光晕与灯的强弱 */
    const fl = 0.5 + 0.5 * Math.sin(f * 0.11), fl2 = 0.5 + 0.5 * Math.sin(f * 0.073 + 2.1), fl3 = 0.5 + 0.5 * Math.sin(f * 0.191 + 0.4);
    DYN.flames.forEach((it, i) => {
      const k = 0.90 + 0.16 * [fl, fl2, fl3][i];
      it.scale = [(5.6 - i * 1.5) * k, (8.4 - i * 2.2) * (1.04 - 0.10 * [fl, fl2, fl3][i]), 1];
      it.material.color = [1, 1, 1, (0.92 - i * 0.12) * (0.9 + 0.1 * fl3)];
    });
    DYN.fireHalo.material.color = [1, 0.72, 0.42, 0.26 + 0.10 * fl];
    DYN.torchFlame.forEach((it, i) => { it.material.color = [1, 1, 1, 0.86 + 0.12 * (0.5 + 0.5 * Math.sin(f * 0.23 + i))]; });
    DYN.torchGlow.forEach((it, i) => { it.material.color = [1, 0.76, 0.46, 0.24 + 0.09 * (0.5 + 0.5 * Math.sin(f * 0.17 + i * 1.3))]; });
    /* 灯也跟着跳：整个场景的明暗随之呼吸 */
    const L = ctx.app.state.light;
    const g = 0.86 + 0.14 * fl;
    L.color = [1.00 * g, 0.60 * g, 0.28 * g];
    L.ambient = [0.15 * (0.92 + 0.16 * fl2), 0.12 * (0.92 + 0.16 * fl2), 0.19 * (0.92 + 0.16 * fl2)];

    /* 舞者：各自相位、边跳边缓缓自转 → 人影互相重叠，边界糊掉 */
    DYN.dancers.forEach((d, i) => {
      const k = Math.floor((f * 0.42 + d.seed * 2.7) / 1) % 12;
      d.material.texture = DYN.danceTex[(k + 12) % 12];
      const bob = 0.05 * Math.abs(Math.sin(f * 0.13 + d.seed)) + 0.02;
      const ox = Math.sin(f * 0.07 + d.seed * 1.7) * 0.35;
      d.position = [d.base[0] + ox, d.base[1] + bob, d.base[2] + Math.cos(f * 0.055 + d.seed) * 0.30];
      d.material.color = [1, 0.98, 0.94, T.subA(f, 620 + d.seed * 6, 646 + d.seed * 6, 1140, 1196)];
    });
    DYN.satyrs.forEach((s, i) => {
      const k = Math.floor((f * 0.60 + i * 2.1) / 1) % 6;
      s.material.texture = DYN.satyrTex[(k + 6) % 6];
      const hop = Math.max(0, Math.sin(f * 0.16 + i * 1.4)) * 0.42;
      s.position = [s.base[0] + Math.sin(f * 0.08 + i) * 0.26, s.base[1] + hop, s.base[2]];
      s.material.color = [1, 0.98, 0.94, T.subA(f, 700 + i * 10, 724 + i * 10, 1150, 1180)];
    });
    DYN.raisers.forEach((r, i) => {
      const k = 2 + Math.floor(0.5 + 0.5 * Math.sin(f * 0.045 + i * 2.0) * 3);
      r.material.texture = DYN.raiseTex[Math.min(5, k)];
      r.material.color = [1, 0.98, 0.94, T.subA(f, 760 + i * 20, 786 + i * 20, 1140, 1190)];
    });
    /* 面具在枝上轻轻转 */
    DYN.masks.forEach((m, i) => {
      m.position = [m.position[0], 2.75 + (i % 2) * 0.5 + Math.sin(f * 0.05 + i) * 0.06, m.position[2]];
    });
  },
});
</script>
